<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#33210f" />
  <title>Sokoban - Moving Boxes</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <p class="brand">Sokoban <span>Moving Boxes</span></p>
      <div class="topbar-actions" id="topbar-actions">
        <button type="button" class="tb-btn" id="btn-mute" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="ico-fill" d="M11 5L6 9H3v6h3l5 4z"/>
            <path class="ico-on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
            <path class="ico-off" d="M16 9.5l5 5M21 9.5l-5 5"/>
          </svg>
          <span class="tb-label" id="mute-label">Muted</span>
        </button>
      </div>
    </header>
    <div class="play-area">
      <main class="stage" id="stage">
        <canvas id="game" width="800" height="600" aria-label="Sokoban game board"></canvas>
      </main>
      <div class="controls" id="controls" hidden>
        <div class="ctl-actions">
          <button type="button" class="ctl ctl-action" id="btn-undo">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="ico-line" d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
            <span>Undo</span>
          </button>
          <button type="button" class="ctl ctl-action" id="btn-restart">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="ico-line" d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5M3.5 3.5v5h5"/></svg>
            <span>Restart</span>
          </button>
        </div>
        <div class="dpad" role="group" aria-label="Move">
          <button type="button" class="ctl ctl-arrow up" data-dx="0" data-dy="-1" aria-label="Move up"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5.5l7.5 12h-15z"/></svg></button>
          <button type="button" class="ctl ctl-arrow left" data-dx="-1" data-dy="0" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5.5l7.5 12h-15z"/></svg></button>
          <button type="button" class="ctl ctl-arrow down" data-dx="0" data-dy="1" aria-label="Move down"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5.5l7.5 12h-15z"/></svg></button>
          <button type="button" class="ctl ctl-arrow right" data-dx="1" data-dy="0" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5.5l7.5 12h-15z"/></svg></button>
        </div>
      </div>
    </div>
  </div>
  <script src="js/engine.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/keypad.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
