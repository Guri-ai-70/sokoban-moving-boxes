<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#33210f" />
  <title>Sokoban - Moving Boxes</title>
  <!-- ?v= is a cache-buster: bump it whenever any css/js file changes, so
       browsers (GitHub Pages, phones) never mix old and new files. -->
  <link rel="stylesheet" href="css/style.css?v=20261014" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <p class="brand">Sokoban <span>Moving Boxes</span></p>
      <div class="topbar-actions" id="topbar-actions">
        <button type="button" class="tb-btn" id="btn-settings" aria-label="Settings" aria-haspopup="dialog" aria-controls="settings" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button type="button" class="tb-btn" id="btn-mute" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="ico-fill" d="M11 5L6 9H3v6h3l5 4z"/>
            <path class="ico-on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
            <path class="ico-off" d="M16 9.5l5 5M21 9.5l-5 5"/>
          </svg>
          <span class="tb-label" id="mute-label">Muted</span>
        </button>
      </div>
    </header>
    <div class="play-area">
      <main class="stage" id="stage">
        <canvas id="game" width="800" height="600" aria-label="Sokoban game board"></canvas>
      </main>
      <div class="controls" id="controls" hidden>
        <div class="ctl-actions">
          <button type="button" class="ctl ctl-action" id="btn-undo">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="ico-line" d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
            <span>Undo</span>
          </button>
          <button type="button" class="ctl ctl-action" id="btn-restart">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="ico-line" d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5M3.5 3.5v5h5"/></svg>
            <span>Restart</span>
          </button>
        </div>
        <div class="dpad" role="group" aria-label="Move">
          <button type="button" class="ctl ctl-arrow up" data-dx="0" data-dy="-1" aria-label="Move up"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5.5l7.5 12h-15z"/></svg></button>
          <button type="button" class="ctl ctl-arrow left" data-dx="-1" data-dy="0" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5.5l7.5 12h-15z"/></svg></button>
          <button type="button" class="ctl ctl-arrow down" data-dx="0" data-dy="1" aria-label="Move down"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5.5l7.5 12h-15z"/></svg></button>
          <button type="button" class="ctl ctl-arrow right" data-dx="1" data-dy="0" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5.5l7.5 12h-15z"/></svg></button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="settings-overlay" hidden>
    <div class="panel" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" tabindex="-1">
      <h2 id="settings-title">Settings</h2>
      <div class="group" role="group" aria-labelledby="theme-label">
        <p class="group-label" id="theme-label">Colour theme</p>
        <div class="opts opts-theme" id="theme-options"></div>
      </div>
      <div class="group" role="group" aria-labelledby="crate-label">
        <p class="group-label" id="crate-label">Crate style</p>
        <div class="opts opts-crate" id="crate-options"></div>
      </div>
      <button type="button" class="ctl panel-done" id="settings-done">Done</button>
    </div>
  </div>

  <script src="js/engine.js?v=20261014"></script>
  <script src="js/levels.js?v=20261014"></script>
  <script src="js/storage.js?v=20261014"></script>
  <script src="js/hud.js?v=20261014"></script>
  <script src="js/audio.js?v=20261014"></script>
  <script src="js/render.js?v=20261014"></script>
  <script src="js/keypad.js?v=20261014"></script>
  <script src="js/settings.js?v=20261014"></script>
  <script src="js/main.js?v=20261014"></script>
</body>
</html>
